# Danh mục nguồn dữ liệu cho AgriSmart Shield (đọc bằng ai/scripts/datasets_catalog.py).
# Thông tin quy mô, lớp, loại nhãn được đọc từ trang gốc ngày 13/10/2026.
# license_verified = false: CHƯA đọc được giấy phép trên trang gốc -> bắt buộc tự kiểm tra trước khi dùng.
#
# level:   A = có mask vết bệnh, huấn luyện phân đoạn được ngay
#          B = có mask/polygon lá hoặc nhãn mức độ nghiêm trọng (bổ trợ lớp leaf, kiểm tra Severity)
#          C = chỉ nhãn phân loại / hộp bao (nguồn ảnh để tự gán polygon, hoặc tập kiểm tra)
#          D = mở rộng phạm vi (ví dụ sâu hại)
#          Q = chưa đọc được trang chi tiết, cần kiểm tra
# pipeline: cách nối vào bộ mã
#          s01_value        mask theo mã lớp            -> s01 --mask-mode value
#          s01_binary       mask nhị phân theo thư mục  -> s01 --mask-mode binary (mask JPG tự ngưỡng hóa)
#          s01b_coco | s01b_labelme | s01b_via          -> s01b --format coco|labelme|via
#          label_then_s01b  chọn ảnh bằng s00b, gán polygon trên Labelme, nhập bằng s01b
#          eval_bbox        đánh giá theo hộp bao lá     -> s06b_eval_bbox.py
#          reference        tham chiếu (thang mức độ, kiểm tra chéo), không đưa thẳng vào huấn luyện
#          out_of_scope     ngoài phạm vi phân đoạn bệnh lá hiện tại
schema_version: 1
checked_on: "2026-10-13"
sources:
  - id: plantseg
    name: "PlantSeg: A Large-Scale In-the-wild Dataset for Plant Disease Segmentation"
    crops: [tomato, cucumber, citrus, rice, multi]
    level: A
    labels: "Mask PNG theo mã lớp bệnh (1–115), nền = 0; JSON LabelMe gốc; file meta CSV"
    size: "11.400+ ảnh bệnh (bảng thống kê ghi 11.458), 115 bệnh trên 34 loại cây; ~480 ảnh cho 3 bệnh cà chua"
    region: "Ảnh thu thập từ Internet (in-the-wild)"
    license: "CC BY-NC-ND 4.0"
    license_verified: true
    doi: null
    urls:
      data: "https://zenodo.org/records/14935094"
      code: "https://github.com/tqwei05/PlantSeg"
      paper: "https://arxiv.org/abs/2409.04038"
    pipeline: s01_value
    notes: "Mã 98/99/102 = đốm vòng / sương mai / đốm lá Septoria cà chua. Không có mask phiến lá. Giấy phép không cho phân phối bản chỉnh sửa."

  - id: plantdoc
    name: "PlantDoc: A Dataset for Visual Plant Disease Detection (bản phát hiện đối tượng)"
    crops: [tomato, multi]
    level: C
    labels: "Hộp bao quanh từng lá + tên bệnh của lá (train_labels.csv, test_labels.csv)"
    size: "2.598 ảnh, 13 loài cây, 17 bệnh; 4 lớp cà chua cần dùng: train 377 ảnh / 1.183 hộp, test 38 ảnh / 84 hộp"
    region: "Ảnh thu thập từ Internet"
    license: "CC BY 4.0"
    license_verified: true
    doi: "10.1145/3371158.3371196"
    urls:
      data: "https://github.com/pratikkayal/PlantDoc-Object-Detection-Dataset"
      paper: "https://arxiv.org/abs/1911.10317"
    pipeline: eval_bbox
    notes: "Không có mask vết bệnh. Dùng làm tập kiểm tra độc lập (s06b) hoặc gợi ý hộp cho SAM khi gán mask lá."

